[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "cms-host"
  omit_hostname = false

# output
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "telegraf"
  skip_database_creation = false
  timeout = "5s"

# хост
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]
[[inputs.swap]]
[[inputs.system]]
[[inputs.processes]]
[[inputs.kernel]]

[[inputs.disk]]
  mount_points = ["/"]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

# docker
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  container_name_include = []
  timeout = "5s"
  perdevice_include = ["cpu"]
  total_include = ["cpu", "blkio", "network"]

# nginx
[[inputs.nginx]]
  urls = ["http://nginx/nginx_status"]
  response_timeout = "5s"

# json-лог nginx, из него берём status и request_time (measurement nginx_access)
[[inputs.tail]]
  files = ["/var/log/nginx/access_json.log"]
  from_beginning = false
  watch_method = "inotify"
  name_override = "nginx_access"
  data_format = "json"
  tag_keys = ["method"]
  json_string_fields = ["uri"]

# -------------------------------------------------------- INPUT: php-fpm ------
[[inputs.phpfpm]]
  urls = ["http://nginx/fpm-status"]
  timeout = "5s"

# mysql
[[inputs.mysql]]
  servers = ["${MYSQL_MONITOR_USER}:${MYSQL_MONITOR_PASSWORD}@tcp(mysql:3306)/"]
  metric_version = 2
  gather_process_list = true
  gather_innodb_metrics = true
  gather_slave_status = false
  gather_binary_logs = false
  gather_table_io_waits = false
  gather_table_lock_waits = false
  gather_index_io_waits = false
  gather_event_waits = false
  gather_file_events_stats = false
  gather_perf_events_statements = false
  gather_table_schema = false
  interval = "10s"

# проверка компонентов
# tcp проверки, result_code 0 = ок, всё остальное = порт не отвечает
[[inputs.net_response]]
  protocol = "tcp"
  address = "nginx:80"
  timeout = "3s"
  interval = "10s"
  [inputs.net_response.tags]
    component = "nginx"

[[inputs.net_response]]
  protocol = "tcp"
  address = "php:9000"
  timeout = "3s"
  interval = "10s"
  [inputs.net_response.tags]
    component = "php-fpm"

[[inputs.net_response]]
  protocol = "tcp"
  address = "mysql:3306"
  timeout = "3s"
  interval = "10s"
  [inputs.net_response.tags]
    component = "mysql"

# http проверка cms целиком (nginx -> php-fpm -> mysql), ждём 200
[[inputs.http_response]]
  urls = ["http://nginx/"]
  method = "GET"
  response_timeout = "5s"
  follow_redirects = true
  response_status_code = 200
  interval = "15s"
  [inputs.http_response.tags]
    component = "wordpress"
