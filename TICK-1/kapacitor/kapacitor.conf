hostname = "kapacitor"
data_dir = "/var/lib/kapacitor"

[http]
  bind-address = ":9092"
  log-enabled = true
  auth-enabled = false

[logging]
  file = "STDERR"
  level = "INFO"

[load]
  enabled = false

[replay]
  dir = "/var/lib/kapacitor/replay"

[task]
  dir = "/var/lib/kapacitor/tasks"
  snapshot-interval = "60s"

[storage]
  boltdb = "/var/lib/kapacitor/kapacitor.db"

# подписываемся на базу telegraf в influxdb
[[influxdb]]
  enabled = true
  name = "localhost"
  default = true
  urls = ["http://influxdb:8086"]
  timeout = 0
  startup-timeout = "1m"
  disable-subscriptions = false
  subscription-protocol = "http"
  [influxdb.subscriptions]
    telegraf = ["autogen"]

# телеграм, включается через .env
[telegram]
  enabled = false
  url = "https://api.telegram.org/bot"
  token = ""
  chat-id = ""
  parse-mode = "Markdown"
  disable-web-page-preview = true
  global = false
  state-changes-only = false
